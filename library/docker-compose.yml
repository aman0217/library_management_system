version: "3.9"

services:

  mysql:
    image: mysql:8.4

    container_name: library_mysql

    restart: always
    environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: library_management_system

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - library-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  library-app:

    build:
      context: .

    container_name: library_backend

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8081:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/library_management_system
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./uploads:/app/uploads

    networks:
      - library-network

networks:
  library-network:

volumes:
  mysql_data: