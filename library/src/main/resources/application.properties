spring.application.name=library

# ==========================
# Database
# ==========================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/library_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:amanak47@123}
